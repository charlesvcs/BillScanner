<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ticket Scanner AI</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon-192.png"> <!-- Remplacez par votre icône -->
    <link rel="manifest" href="manifest.json">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen flex flex-col p-4 pb-20">

    <header class="text-center py-6">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
            Smart Receipt
        </h1>
        <p class="text-gray-400 text-sm mt-2">100% Local & Privé (WebGPU)</p>
    </header>

    <main class="flex-1 max-w-md mx-auto w-full flex flex-col gap-6">
        
        <!-- Zone de Scan -->
        <div class="relative bg-gray-800 rounded-2xl p-6 border border-gray-700 text-center shadow-lg">
            <label for="camera-input" class="cursor-pointer flex flex-col items-center justify-center gap-4">
                <div class="w-16 h-16 bg-blue-500 rounded-full flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </div>
                <span class="text-lg font-semibold text-blue-400">Scanner un ticket</span>
                <span class="text-xs text-gray-400">Appareil photo ou galerie</span>
            </label>
            <input type="file" id="camera-input" accept="image/*" capture="environment" class="hidden">
        </div>

        <!-- Zone de Statut / Progression -->
        <div id="status-container" class="hidden bg-gray-800 rounded-2xl p-4 border border-gray-700">
            <p id="status-text" class="text-sm text-center text-gray-300 mb-2">Initialisation...</p>
            <div class="w-full bg-gray-700 rounded-full h-2.5">
                <div id="progress-bar" class="bg-blue-500 h-2.5 rounded-full" style="width: 0%"></div>
            </div>
        </div>

        <!-- Résultat Actuel -->
        <div id="result-container" class="hidden bg-gray-800 rounded-2xl border border-green-500/50 shadow-lg shadow-green-500/10 overflow-hidden">
            <div class="bg-gray-700/50 p-4 border-b border-gray-700">
                <div class="flex justify-between items-center">
                    <h2 id="res-magasin" class="text-xl font-bold text-white">Magasin</h2>
                    <span id="res-date" class="text-sm text-gray-400">Date</span>
                </div>
            </div>
            <div class="p-4">
                <ul id="res-articles" class="space-y-2 mb-4 text-sm text-gray-300">
                    <!-- Les articles seront injectés ici -->
                </ul>
                <div class="flex justify-between items-center border-t border-gray-700 pt-3">
                    <span class="font-bold text-gray-200">TOTAL</span>
                    <span id="res-total" class="text-2xl font-black text-green-400">0.00 €</span>
                </div>
            </div>
        </div>

        <!-- Historique -->
        <div>
            <h3 class="text-lg font-semibold text-gray-400 mb-3 border-b border-gray-700 pb-2">Historique</h3>
            <div id="history-list" class="space-y-3">
                <!-- L'historique sera injecté ici -->
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
